[project]
name = "mewcode"
version = "0.1.0"
description = "A Claude Code style terminal AI agent"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "rich>=13",
    "anthropic>=0.40",
    "openai>=1.50",
    "pyyaml>=6",
    "mcp>=1.0",
    "httpx2>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
mewcode = "mewcode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mewcode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# 历史扁平实现备份目录不属于活动代码，不参与 lint / format
extend-exclude = [".legacy-backup", ".legacy-backup-flat"]
